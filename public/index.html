<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Findomestica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark"></span>Findomestica</div>
      <nav id="nav" class="nav"></nav>
    </aside>
    <div class="content">
      <header class="topbar">
        <div class="month-picker">
          <button class="icon-btn" id="prev-month" aria-label="Mês anterior">‹</button>
          <input type="month" id="month" aria-label="Mês de referência">
          <button class="icon-btn" id="next-month" aria-label="Próximo mês">›</button>
        </div>
        <input type="search" id="search" class="search" placeholder="Buscar transações...">
      </header>
      <main id="view" class="view"></main>
    </div>
  </div>
  <div id="modal-root"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
